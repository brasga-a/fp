[workspace]
members = ["crates/fp-cli", "crates/fp-workspace", "crates/fp-database", "crates/fp-update"]
default-members = ["crates/fp-cli"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/brasga-a/fp"

[workspace.dependencies]
sha2 = "0.11.1"
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive", "env"] }
cliclack = "0.5"
console = "0.16"
toml_edit = "0.25"
serde_json = "1"
tempfile = "3"
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "checksums"] }
semver = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
