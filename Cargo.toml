[package]
name = "fiap-projects"
version = "0.1.0"
edition = "2024"
description = "Pequena CLI nativa para projetos acadêmicos FIAP"
license = "MIT"
repository = "https://github.com/brasga-a/fp"
readme = "README.md"

[[bin]]
name = "fp"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
cliclack = "0.5"
console = "0.16"
toml_edit = "0.25"
serde_json = "1"
tempfile = "3"
self_update = { version = "1.3.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "checksums"] }
semver = "1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
