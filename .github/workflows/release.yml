name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag estável existente a publicar (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      tag: ${{ inputs.tag || github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publicar release validada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cd dist
          cat SHA256SUMS-* > SHA256SUMS
          sha256sum --check SHA256SUMS
          # create rejeita releases existentes; nunca use --clobber.
          # O rascunho só se torna público depois de todos os uploads concluírem.
          gh release create "$TAG" "fp-$TAG-x86_64-unknown-linux-gnu.tar.gz" \
            "fp-$TAG-x86_64-pc-windows-msvc.zip" SHA256SUMS \
            --verify-tag --draft --title "FP $TAG" --generate-notes
          gh release edit "$TAG" --draft=false
